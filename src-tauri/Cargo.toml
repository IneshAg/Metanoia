[package]
name = "metanoia-v2"
version = "0.2.0"
description = "Metanoia daily workspace"
authors = ["Metanoia"]
edition = "2021"

[lib]
name = "metanoia_v2_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
